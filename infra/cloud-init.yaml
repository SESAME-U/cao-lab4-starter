#cloud-config
# Runs once, at the first boot of the VM. Terraform passes this file as
# custom_data. Configuration of a running server is Ansible's job (weeks 2-4);
# this only proves the VM is up and serving HTTP.
package_update: true
packages:
  - nginx
runcmd:
  - echo "<h1>Hello from Terraform on $(hostname)</h1>" > /var/www/html/index.html
